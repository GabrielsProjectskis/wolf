[package]
name = "wolf"
version = "1.0.0"
description = "Invoices and quotes for EU freelancers"
authors = ["Gabriel Jukema"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wolf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
